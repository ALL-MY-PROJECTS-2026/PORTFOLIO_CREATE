name: Update visitor stats

# GA4 방문 통계를 주기적으로 조회해 stats.json(사이트 루트)을 갱신한다.
# 값이 바뀌면 main에 커밋 → Pages 배포 워크플로를 명시적으로 트리거한다.
#
# 필요한 레포 Secrets:
#   GA4_PROPERTY_ID  GA4 속성 ID(숫자)
#   GA4_SA_KEY       서비스 계정 JSON 키 전체 (GA4 속성 '뷰어' 권한)
on:
  schedule:
    - cron: '7 */3 * * *' # 3시간마다(UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install auth lib
        run: npm i --no-save google-auth-library

      - name: Fetch GA4 stats
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: node scripts/fetch-ga4-stats.mjs

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- stats.json; then
            echo "변경 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "chore(stats): 방문 통계 갱신"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 으로 한 push 는 Pages 배포(on: push)를 자동 트리거하지 않는다.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
