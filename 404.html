<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>없는 주소입니다 — Portfolio Maker</title>
  <meta name="description" content="찾으시는 페이지가 없습니다. Portfolio Maker의 주요 페이지로 안내합니다." />
  <!-- 없는 주소를 검색에 올릴 이유가 없습니다. -->
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="./theme.css" />
  <script>
    /* 첫 칠 전에 저장된 모드를 입힙니다 — 안 그러면 라이트가 한 번 번쩍입니다. */
    (function () {
      try {
        var t = localStorage.getItem('pb:guide-theme');
        if (t === 'dark' || t === 'eye') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 무시 — 기본 라이트 */ }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font: 15px/1.8 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
      word-break: keep-all;
    }
    main { max-width: 560px; padding: 40px 20px 60px; text-align: center; }
    .code { font-size: 56px; font-weight: 800; letter-spacing: -2px; color: var(--line-strong); line-height: 1; }
    h1 { margin: 10px 0 8px; font-size: 22px; letter-spacing: -0.5px; }
    .lead { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .links a {
      padding: 9px 15px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r, 4px);
      color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 600;
    }
    .links a:hover { border-color: var(--accent); }
    .links a.go { background: var(--accent); border-color: var(--accent); color: #fff; }
    footer { margin-top: 34px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>없는 주소입니다</h1>
    <p class="lead">주소가 바뀌었거나, 오타가 있었을 수 있습니다.<br />아래에서 찾으시는 곳으로 가세요.</p>
    <div class="links">
      <a class="go" href="/">포트폴리오 만들러 가기</a>
      <a href="/guide/">가이드</a>
      <a href="/guide/how-to.html">사용 방법</a>
      <a href="/contact.html">문의</a>
    </div>
    <footer>Portfolio Maker</footer>
  </main>
  <script src="./theme.js"></script>
</body>
</html>
